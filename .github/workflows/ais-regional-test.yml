
name: AIS Princess Local Coverage Test

on:
  workflow_dispatch:

jobs:
  local-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install WebSocket client
        run: npm install --no-save ws

      - name: Monitor waters near Princess ships
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          node <<'JS'
          const WebSocket = require('ws');
          const key = process.env.AISSTREAM_API_KEY;

          if (!key) {
            console.error('Missing AISSTREAM_API_KEY secret');
            process.exit(1);
          }

          // Areas around last reported positions,
          // not necessarily current ship locations.
          const regions = {
            Crete: {
              minLat: 35.0, maxLat: 37.0,
              minLon: 23.0, maxLon: 26.0,
              count: 0
            },
            Bahamas: {
              minLat: 24.0, maxLat: 27.0,
              minLon: -77.0, maxLon: -73.0,
              count: 0
            }
          };

          const ships = {
            '310791000': 'Enchanted Princess',
            '310869000': 'Star Princess'
          };

          const counts = {};
          let confirmed = false;
          let total = 0;
          let princessMatches = 0;
          let sampleCount = 0;
          let subscriptionError = false;

          const ws = new WebSocket(
            'wss://stream.aisstream.io/v0/stream'
          );

          ws.on('open', () => {
            console.log('Connected to AISStream');

            ws.send(JSON.stringify({
              APIKey: key,
              BoundingBoxes: [
                [[35.0, 23.0], [37.0, 26.0]],
                [[24.0, -77.0], [27.0, -73.0]]
              ],
              FilterMessageTypes: [
                'PositionReport',
                'StandardClassBPositionReport',
                'ExtendedClassBPositionReport'
              ]
            }));
          });

          ws.on('message', buf => {
            let msg;
            try {
              msg = JSON.parse(buf.toString());
            } catch {
              return;
            }

            if (msg.MessageType === 'SubscriptionConfirmation') {
              confirmed = true;
              console.log('Subscription confirmed');
              return;
            }

            if (msg.MessageType === 'Error' ||
                msg.MessageType === 'SubscriptionError') {
              subscriptionError = true;
              console.error('AISStream error:', JSON.stringify(msg));
              return;
            }

            const type = msg.MessageType;
            if (![
              'PositionReport',
              'StandardClassBPositionReport',
              'ExtendedClassBPositionReport'
            ].includes(type)) return;

            const p = msg.Message?.[type];
            if (!p) return;

            const lat = p.Latitude;
            const lon = p.Longitude;
            const mmsi = String(
              msg.MetaData?.MMSI ?? p.UserID ?? ''
            );

            if (!Number.isFinite(lat) ||
                !Number.isFinite(lon)) return;

            total++;
            counts[type] = (counts[type] || 0) + 1;

            for (const [name, r] of Object.entries(regions)) {
              if (lat >= r.minLat && lat <= r.maxLat &&
                  lon >= r.minLon && lon <= r.maxLon) {
                r.count++;
              }
            }

            if (sampleCount < 8) {
              console.log(
                `TRAFFIC: MMSI=${mmsi} LAT=${lat} LON=${lon}`
              );
              sampleCount++;
            }

            if (ships[mmsi]) {
              princessMatches++;
              console.log(
                `*** PRINCESS MATCH: ${ships[mmsi]} ***`
              );
              console.log(
                `MMSI=${mmsi} LAT=${lat} LON=${lon}`
              );
              console.log(
                `Timestamp=${msg.MetaData?.time_utc ?? 'unknown'}`
              );
            }
          });

          ws.on('error', err => {
            console.error('Connection error:', err.message);
            subscriptionError = true;
          });

          setTimeout(() => {
            console.log('========== FINAL RESULTS ==========');
            console.log('Subscription confirmed:', confirmed);
            console.log('Total reports:', total);
            console.log('Crete reports:', regions.Crete.count);
            console.log('Bahamas reports:', regions.Bahamas.count);
            console.log('Princess matches:', princessMatches);
            console.log('Message types:', JSON.stringify(counts));
            console.log('===================================');
            ws.close();
            process.exit(confirmed && !subscriptionError ? 0 : 1);
          }, 120000);
          JS
